name: Update AI Toolbox

on:
  schedule:
    # Tous les lundis à 07h00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:  # Déclenchement manuel possible

permissions:
  contents: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade ddgs google-generativeai

      - name: Search & update tools.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update.py

      - name: Generate index.html
        run: python scripts/generate.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tools.json index.html
          git diff --staged --quiet || git commit -m "🤖 Auto-update: $(date '+%Y-%m-%d')"
          git push
