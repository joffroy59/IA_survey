name: Update AI Toolbox

on:
  schedule:
    # Tous les lundis à 07h00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  update-each-profile:
    strategy:
      fail-fast: false
      matrix:
        profile: [general, enterprise, discovery, ragdev, agentdev, vscode, newrag, cowork, ocr, dococr]
    uses: ./.github/workflows/update-profile-unit.yml
    with:
      profile: ${{ matrix.profile }}
    secrets: inherit

  generate-and-commit:
    needs: update-each-profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download updated datasets
        uses: actions/download-artifact@v4
        with:
          pattern: dataset-*
          merge-multiple: true
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate pages
        run: python scripts/generate.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tools.json data/tools-enterprise.json data/tools-discovery.json data/tools-ragdev.json data/tools-agentdev.json
          git add data/tools-vscode.json data/tools-newrag.json data/tools-cowork.json data/tools-ocr.json data/tools-dococr.json
          git add index.html enterprise.html discovery.html ragdev.html agentdev.html
          git add vscode.html newrag.html cowork.html ocr.html dococr.html compare-view.html
          git diff --staged --quiet || git commit -m "🤖 Auto-update: $(date '+%Y-%m-%d')"
          git push
